<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HTML Test Page</title>
    <style>
        body {
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, sans-serif;
            background-color: #f0f4f8;
            color: #333;
            max-width: 600px;
            margin: 50px auto;
            padding: 20px;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        h1 {
            color: #0066cc;
        }
        .success-box {
            background-color: #d4edda;
            color: #155724;
            padding: 15px;
            border-radius: 4px;
            border: 1px solid #c3e6cb;
            margin-top: 20px;
        }
        button {
            background-color: #0066cc;
            color: white;
            border: none;
            padding: 10px 15px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 14px;
        }
        button:hover {
            background-color: #004499;
        }
    </style>
</head>
<body>

    <h1>HTML Boilerplate Test</h1>
    <p>If you can see this page formatted nicely in your browser, your HTML file is working correctly!</p>
    
    <hr>

    <h3>Interactive Test</h3>
    <p>Click the button below to verify that JavaScript features are also functioning.</p>
    <button onclick="runTest()">Click Me</button>

    <div id="test-result"></div>

    <script>
        function runTest() {
            const resultDiv = document.getElementById('test-result');
            resultDiv.innerHTML = `
                <div class="success-box">
                    <strong>Success!</strong> JavaScript is running successfully on this page.
                </div>
            `;
        }
    </script>

</body>
</html>
